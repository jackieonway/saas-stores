# Runtime only: independently build the frontend/backend images first.
services:
  stores-postgres:
    image: ${POSTGRES_IMAGE:?Set an approved PostgreSQL image digest}
    environment:
      POSTGRES_USER: stores
      POSTGRES_DB: stores
      POSTGRES_PASSWORD: ${STORES_POSTGRES_PASSWORD:?Set the dedicated database password}
    volumes: [business-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U stores -d stores']
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    networks: [database]
  stores-api:
    image: ${STORES_API_IMAGE:?Set this application's API image digest}
    environment:
      NODE_ENV: production
      STORES_HOST: 0.0.0.0
      STORES_PORT: '3031'
      STORES_DATABASE_URL: ${STORES_DATABASE_URL:?Set the dedicated business database URL}
      STORES_ALLOWED_ORIGINS: 'null'
      STORES_METRICS_TOKEN: ${STORES_METRICS_TOKEN:-}
      PLATFORM_API_ORIGIN: ${PLATFORM_API_ORIGIN:?Set the real platform HTTPS origin}
      PLATFORM_CLIENT_ID: ${PLATFORM_CLIENT_ID:?Set this application's confidential client ID}
      PLATFORM_CLIENT_SECRET: ${PLATFORM_CLIENT_SECRET:?Set this application's confidential client secret}
    depends_on:
      stores-postgres: {condition: service_healthy}
    ports:
      - '127.0.0.1:${API_PORT:-3031}:3031'
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=32m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    networks: [database, edge]
  stores-web:
    image: ${STORES_FRONTEND_IMAGE:?Set this application's static frontend image digest}
    ports:
      - '127.0.0.1:${FRONTEND_PORT:-3014}:8080'
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=32m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    networks: [edge]
networks:
  database:
    internal: true
  edge:
    external: true
    name: ${EDGE_NETWORK_NAME:?Set the existing private gateway network}
volumes:
  business-data:
