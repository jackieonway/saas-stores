# Local deployment composition. Application routes belong here, outside the host source.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    # Avoid recording business URLs, credentials or query parameters.
    access_log off;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    map $uri $release_cache {
        default "public, max-age=31536000, immutable";
        ~*\.html$ "no-cache";
    }
    map $status $release_response_cache {
        default "no-store";
        200 $release_cache;
        304 $release_cache;
    }
    server {
        listen 127.0.0.1:3000;
        server_name 127.0.0.1 localhost;
        client_max_body_size 32m;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_buffering off;

        location = /stores-api/internal { return 404; }
        location ^~ /stores-api/internal/ { return 404; }
        location = /stores-api/metrics { return 404; }
        location ^~ /stores-api/metrics/ { return 404; }
        location = /stores-api { proxy_pass http://127.0.0.1:3031; }
        # Preserve Origin and OPTIONS; the business API validates CORS itself.
        location /stores-api/ { proxy_pass http://127.0.0.1:3031; }

        location ~ ^/sub-apps/stores/versions/[A-Za-z0-9][A-Za-z0-9._-]*/.+$ {
            rewrite ^/sub-apps/(.*)$ /$1 break;
            root /srv/micro-apps;
            disable_symlinks on;
            autoindex off;
            # Revalidate entry bytes across a switch from another local static server.
            # Versioned JS/CSS retain their immutable browser cache.
            if_modified_since off;
            etag off;
            try_files $uri =404;
            limit_except GET { deny all; }
            add_header Access-Control-Allow-Origin "*" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Cache-Control $release_response_cache always;
        }
        location /sub-apps/stores/ { return 404; }
        # Vite, platform APIs and existing notification WebSockets retain their routing.
        location / { proxy_pass http://127.0.0.1:3002; }
    }
}
